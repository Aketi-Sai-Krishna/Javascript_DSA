<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function debounce (fn, delay){
            let timer;
            return function (...args){
                clearTimeout(timer);

                timer = setTimeout(() => {
                    fn(...args);
                },delay);
            };
        }

        function throttle(fn, delay) {
            let allow = true;
            return function (...args) {
                if (!allow) return;

                fn(...args);

                allow = false;

                setTimeout(() => {
                allow = true;
                }, delay);
            };
        }

    </script>
</body>
</html>
